    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 24px 40px}
  header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  header.top h1{font-size:21px;font-weight:700;letter-spacing:.2px}
  header.top .hint{color:var(--sub);font-size:13px}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* ===== 预览区 ===== */
  .preview-card{padding:18px}
  .preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .preview-head .title{font-weight:600;font-size:14px}
  .badge{font-size:12px;color:var(--sub);background:#f3f5fa;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  .stage{
    position:relative;width:100%;border-radius:10px;overflow:hidden;
    background:#11151c;min-height:260px;display:flex;align-items:center;justify-content:center;
  }
  .stage video{display:block;width:auto;max-width:100%;height:auto;max-height:62vh;margin:0 auto}
  .stage .drop{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#c3c9d6;gap:10px;text-align:center;padding:24px;border:2px dashed rgba(255,255,255,.22);border-radius:10px;cursor:pointer;
  }
  .stage.dragover .drop{border-color:var(--brand);background:rgba(59,91,219,.12)}
  .stage .drop svg{opacity:.85}
  .stage .drop b{color:#e8ebf2;font-size:15px;font-weight:600}
  .stage .drop span{font-size:12.5px;color:#9aa3b5}
  .wm-overlay{position:absolute;pointer-events:none;display:none}
  .wm-overlay img{width:100%;height:100%;display:block}

  /* ===== 控制面板 ===== */
  .panel-card{padding:18px;display:flex;flex-direction:column;gap:16px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field > label{font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:space-between}
  .field > label .val{font-weight:500;color:var(--brand);font-variant-numeric:tabular-nums}
  .file-btn{
    display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border-radius:9px;
    border:1px solid var(--line);background:#fafbfe;color:var(--ink);cursor:pointer;font-size:13px;
    transition:border-color .15s,background .15s;
  }
  .file-btn:hover{border-color:var(--brand);background:#f5f7ff}
  .file-btn svg{flex:none}
  .file-btn .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
  .file-btn.has .fname{color:var(--ink)}
  input[type=file]{display:none}
  .built-wm{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;
    border:1px solid var(--line);background:#fafbfe}
  .built-wm img{height:26px;width:auto;flex:none;border-radius:3px;border:1px solid var(--line)}
  .built-wm .fname{color:var(--ink);font-size:13px}

  .grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .grid9 button{
    height:40px;border:1px solid var(--line);background:#fafbfe;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .grid9 button:hover{border-color:var(--brand)}
  .grid9 button.on{border-color:var(--brand);background:#eef2ff;box-shadow:inset 0 0 0 1px var(--brand)}
  .grid9 button i{width:10px;height:10px;border-radius:3px;background:#c2c9d8;display:block}
  .grid9 button.on i{background:var(--brand)}

  input[type=range]{width:100%;accent-color:var(--brand);height:28px;cursor:pointer}

  .btn-primary{
    width:100%;padding:12px 14px;border:none;border-radius:9px;background:var(--brand);color:#fff;
    font-size:14.5px;font-weight:600;cursor:pointer;transition:background .15s;
  }
  .btn-primary:hover:not(:disabled){background:var(--brand-dark)}
  .btn-primary:disabled{background:#aab4d6;cursor:not-allowed}
  .btn-ghost{
    width:100%;padding:10px;border:1px solid var(--line);background:#fff;border-radius:9px;
    font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);
  }
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand)}

  .progress{display:none;flex-direction:column;gap:6px}
  .progress.on{display:flex}
  .bar{height:8px;border-radius:99px;background:#eef0f6;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .12s linear}
  .progress .ptext{font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between}
  .result{display:none;flex-direction:column;gap:10px;padding:12px;border-radius:9px;background:#f1f8f4;border:1px solid #cfe7db}
  .result.on{display:flex}
  .result .r-head{font-weight:600;color:var(--ok);font-size:13.5px;display:flex;align-items:center;gap:7px}
  .result .meta{font-size:12px;color:var(--sub)}
  .msg{font-size:12.5px;color:var(--danger);display:none}
  .msg.on{display:block}
  .note{font-size:12px;color:var(--sub);line-height:1.55}
  .sel{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;
    font-size:13px;color:var(--ink);font-family:inherit;cursor:pointer}
  hr.sep{border:none;border-top:1px solid var(--line)}

  @media (max-width: 900px){
    .layout{grid-template-columns:1fr}
    .app{padding:18px 14px 32px}
    .stage video{max-height:52vh}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>短视频水印工具</h1>
    <span class="hint">本地浏览器处理，文件不上传 · 输出 X 兼容的 H.264 MP4</span>
  </header>

  <div class="layout">
    <!-- ===== 预览区 ===== -->
    <section class="card preview-card">
      <div class="preview-head">
        <span class="title">效果预览</span>
        <span class="badge" id="resBadge">未加载视频</span>
      </div>
      <div class="stage" id="stage">
        <video id="video" playsinline></video>
        <div class="wm-overlay" id="wmOverlay"><img id="wmPreviewImg" alt=""></div>
        <div class="drop" id="dropZone">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <b>点击选择视频，或把视频拖到这里</b>
          <span>支持 MP4 / WebM / MOV，时长不限</span>
        </div>
      </div>
    </section>

    <!-- ===== 控制面板 ===== -->
    <aside class="card panel-card">
      <div class="field">
        <label>1. 选择视频</label>
        <button type="button" class="file-btn" id="videoBtn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3b5bdb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          <span class="fname" id="videoFname">未选择文件</span>
        </button>
        <input type="file" id="videoInput" accept="video/*">
      </div>

      <div class="field">
        <label>水印（已内置，无需选择）</label>
        <div class="built-wm">
          <img id="builtWmPreview" alt="内置水印">
          <span class="fname" id="imgFname">AI PHOTO ANIMATOR.AI</span>
        </div>
      </div>

      <hr class="sep">

      <div class="field">
        <label>水印位置</label>
        <div class="grid9" id="grid9"></div>
      </div>

      <div class="field">
        <label>水印大小 <span class="val" id="ratioVal">25%</span></label>
        <input type="range" id="ratioRange" min="5" max="80" step="1">
      </div>

      <div class="field">
        <label>边缘距离 <span class="val" id="marginVal">24 px</span></label>
        <input type="range" id="marginRange" min="0" max="120" step="2">
      </div>

      <div class="field">
        <label>不透明度 <span class="val" id="opacityVal">100%</span></label>
        <input type="range" id="opacityRange" min="10" max="100" step="1">
      </div>

      <div class="field">
        <label>输出清晰度</label>
        <select id="sizeSel" class="sel">
          <option value="0">跟源片一致（不放大）</option>
          <option value="1440">长边 2560（2K）</option>
          <option value="2160">长边 3840（4K）</option>
        </select>
        <span class="note" style="display:block;margin-top:6px">放大只提高像素尺寸，不能变出源片没有的细节。</span>
      </div>

      <hr class="sep">

      <button type="button" class="btn-primary" id="runBtn" disabled>开始生成</button>
      <div class="msg" id="errMsg"></div>

      <div class="progress" id="progress">
        <div class="bar"><i id="barFill"></i></div>
        <div class="ptext"><span id="pLabel">处理中…</span><span id="pPercent">0%</span></div>
      </div>

      <div class="result" id="result">
        <div class="r-head">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2f9e6e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          生成完成
        </div>
        <div class="meta" id="resultMeta"></div>
        <button type="button" class="btn-primary" id="downloadBtn">下载视频</button>
        <button type="button" class="btn-ghost" id="againBtn">再做一个</button>
      </div>

      <p class="note">设置会自动保存在本机浏览器中，下次打开沿用上次的位置、大小与清晰度。逐帧精确绘制，帧率跟随源片（24/30/60fps 原样保留）。</p>
    </aside>
  </div>
</div>

  var cfg = loadConfig(); // {position, ratio, margin, opacity}

  var state = {
    videoFile:null, imageFile:null, imgLoaded:false,
    videoReady:false, duration:0, hasAudio:false,

      wmOverlay=$('wmOverlay'), wmPreviewImg=$('wmPreviewImg'),
      builtWmPreview=$('builtWmPreview'),
      videoInput=$('videoInput'),
      videoBtn=$('videoBtn'),
      videoFname=$('videoFname'), imgFname=$('imgFname'),
      ratioRange=$('ratioRange'), marginRange=$('marginRange'), opacityRange=$('opacityRange'),
      ratioVal=$('ratioVal'), marginVal=$('marginVal'), opacityVal=$('opacityVal'),
      sizeSel=$('sizeSel'),
      runBtn=$('runBtn'), errMsg=$('errMsg'),
      progress=$('progress'), barFill=$('barFill'), pLabel=$('pLabel'), pPercent=$('pPercent'),
      result=$('result'), resultMeta=$('resultMeta'), downloadBtn=$('downloadBtn'), againBtn=$('againBtn'),
      resBadge=$('resBadge');

  /* ---------- 配置持久化 ---------- */
  function loadConfig(){
    var def = {position:'br', ratio:25, margin:24, opacity:100, maxEdge:0};
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){ var s = JSON.parse(raw); return Object.assign(def, s); }
    }catch(e){}
    return def;
  }
  function saveConfig(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); }catch(e){}
  }

  /* ---------- 9 宫格 ---------- */
  var grid9=$('grid9');
  POSITIONS.forEach(function(p){
    var b=document.createElement('button');
    b.type='button'; b.dataset.pos=p; b.setAttribute('aria-label','位置 '+p);
    b.appendChild(document.createElement('i'));
    b.addEventListener('click',function(){
      cfg.position=p; saveConfig(); syncGrid(); applyOverlay();
    });
    grid9.appendChild(b);
  });
  function syncGrid(){
    var btns=grid9.querySelectorAll('button');
    for(var i=0;i<btns.length;i++){
      btns[i].classList.toggle('on', btns[i].dataset.pos===cfg.position);
    }
  }

  /* ---------- 滑块 ---------- */
  ratioRange.value=cfg.ratio; marginRange.value=cfg.margin; opacityRange.value=cfg.opacity;
  sizeSel.value=String(cfg.maxEdge||0);
  sizeSel.addEventListener('change',function(){
    cfg.maxEdge=parseInt(this.value,10)||0;
    saveConfig(); syncResBadge();
  });
  ratioRange.addEventListener('input',function(){
    cfg.ratio=parseInt(this.value,10); ratioVal.textContent=cfg.ratio+'%';
    saveConfig(); applyOverlay();
  });
  marginRange.addEventListener('input',function(){
    cfg.margin=parseInt(this.value,10); marginVal.textContent=cfg.margin+' px';
    saveConfig(); applyOverlay();
  });
  opacityRange.addEventListener('input',function(){
    cfg.opacity=parseInt(this.value,10); opacityVal.textContent=cfg.opacity+'%';
    saveConfig(); applyOverlay();
  });
  function syncRangeLabels(){
    ratioVal.textContent=cfg.ratio+'%';
    marginVal.textContent=cfg.margin+' px';
    opacityVal.textContent=cfg.opacity+'%';
  }

  /* 预览角标：源尺寸 →（放大时）输出尺寸 + 音轨 + 时长 */
  function syncResBadge(){
    if(!video.videoWidth){ resBadge.textContent='未加载视频'; return; }
    var sw=Math.round(video.videoWidth), sh=Math.round(video.videoHeight);
    var o=outputSize(sw,sh,cfg.maxEdge);
    var sizeTxt = (o.w===sw && o.h===sh) ? (sw+'×'+sh) : (sw+'×'+sh+' → '+o.w+'×'+o.h);
    var durTxt = (isFinite(state.duration) && state.duration>0) ? ' · '+state.duration.toFixed(1)+'s' : '';
    resBadge.textContent = sizeTxt + (state.hasAudio?' · 含音频':' · 静音') + durTxt;
  }

  /* 输出尺寸：maxEdge=0 跟源片一致；指定长边时等比放大，取偶数像素避免编码器裁剪 */
  function outputSize(w,h,maxEdge){
    if(!maxEdge || maxEdge<=Math.max(w,h)) return {w:w,h:h};
    var k=maxEdge/Math.max(w,h);
    return {w:Math.round(w*k/2)*2, h:Math.round(h*k/2)*2};
  }

  /* ---------- 文件选择 ---------- */
  videoBtn.addEventListener('click',function(){ videoInput.click(); });
  videoInput.addEventListener('change',function(){
    if(this.files && this.files[0]) handleVideo(this.files[0]);
  });

  builtWmPreview.src = BUILTIN_WM;
  wmPreviewImg.onload = function(){
    if(!wmPreviewImg.naturalWidth) return;
    state.imgLoaded = true;
    applyOverlay(); updateRunBtn();
  };
  wmPreviewImg.onerror = function(){
    showError('内置水印加载失败，请刷新页面重试。');

  /* 拖拽 */
  ['dragenter','dragover'].forEach(function(ev){
    stage.addEventListener(ev,function(e){ e.preventDefault(); stage.classList.add('dragover'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    stage.addEventListener(ev,function(e){ e.preventDefault(); stage.classList.remove('dragover'); });
  });
  stage.addEventListener('drop',function(e){
    var f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f && f.type.indexOf('video/')===0) handleVideo(f);
  });
  dropZone.addEventListener('click',function(){ videoInput.click(); });

  function handleVideo(file){
    showError('');
    if(state.videoURL){ URL.revokeObjectURL(state.videoURL); }
    state.videoFile=file; state.videoURL=URL.createObjectURL(file);
    videoFname.textContent=file.name; videoBtn.classList.add('has');
    video.src=state.videoURL;
    state.videoReady=false;
  }

  video.addEventListener('loadedmetadata',function(){
    state.duration=video.duration || 0;
    state.hasAudio = detectAudio(video);
    /* 不再限制时长：视频能解码即用，时长只作提示 */
    state.videoReady=true;
    dropZone.style.display='none';
    syncResBadge();
    applyOverlay(); updateRunBtn();
  });
  video.addEventListener('error',function(){
    showError('视频无法读取或格式不受支持，请换一个文件。');
    state.videoReady=false;
    dropZone.style.display='flex';
    updateRunBtn();
  });

  function detectAudio(el){
    if(el.audioTracks && el.audioTracks.length>0) return true;
    try{
      var s = el.captureStream ? el.captureStream() :
              (el.mozCaptureStream && el.mozCaptureStream());
      return !!(s && s.getAudioTracks && s.getAudioTracks().length>0);
    }catch(e){ return false; }
  }

  function handleImage(file){
    showError('');
    if(state.imageURL){ URL.revokeObjectURL(state.imageURL); }
    state.imgLoaded=false;
    state.imageFile=file; state.imageURL=URL.createObjectURL(file);
    imgFname.textContent=file.name; imgBtn.classList.add('has');
    wmPreviewImg.onload=function(){
      if(!wmPreviewImg.naturalWidth || !wmPreviewImg.complete){ onImageError(); return; }
      state.imgLoaded=true; applyOverlay(); updateRunBtn();
    };
    wmPreviewImg.onerror=onImageError;
    wmPreviewImg.src=state.imageURL;
    /* 缓存命中时 onload 可能已在赋值瞬间结束，这里做同步兜底 */
    if(wmPreviewImg.complete && wmPreviewImg.naturalWidth){
      state.imgLoaded=true; applyOverlay(); updateRunBtn();
    }
  }
  function onImageError(){
    state.imgLoaded=false;
    wmOverlay.style.display='none';
    updateRunBtn();
    showError('水印图片无法读取或格式不受支持（常见于 HEIC 照片），请另存为 PNG 或 JPG 后重新选择。');
  }

  /* ---------- 预览定位（百分比体系，规避 letterbox 问题） ---------- */
  function posToPercent(pos, wPct, mPctX, mPctY){
    var col=pos.charAt(1), row=pos.charAt(0);
    var x,y;
    if(col==='l') x=mPctX;
    else if(col==='c') x=(100-wPct)/2;
    else x=100-wPct-mPctX;
    if(row==='t') y=mPctY;
    else if(row==='m') y=(100-wPct*imgAspectRatio())/2;
    else y=100-wPct*imgAspectRatio()-mPctY;
    return {x:x,y:y};
  }
  function imgAspectRatio(){
    if(wmPreviewImg.naturalWidth) return wmPreviewImg.naturalHeight/wmPreviewImg.naturalWidth;
    return 1;
  }

  function applyOverlay(){
    if(!state.imgLoaded || !state.videoReady){
      wmOverlay.style.display='none'; return;
    }
    var wPct=cfg.ratio;
    var hPct=wPct*imgAspectRatio();
    var mPctX = state.videoReady && video.videoWidth ? cfg.margin/video.videoWidth*100 : 0;
    var mPctY = state.videoReady && video.videoHeight ? cfg.margin/video.videoHeight*100 : 0;
    var pt=posToPercent(cfg.position,wPct,mPctX,mPctY);
    wmOverlay.style.display='block';
    wmOverlay.style.width=wPct+'%';
    wmOverlay.style.height=hPct+'%';
    wmOverlay.style.left=pt.x+'%';
    wmOverlay.style.top=pt.y+'%';
    wmOverlay.style.opacity=String(cfg.opacity/100);
  }

  /* ---------- 生成 ---------- */
  function updateRunBtn(){
    runBtn.disabled = !(state.videoReady && state.imgLoaded && !state.processing);
  }
  function showError(t){
    errMsg.textContent=t; errMsg.classList.toggle('on', !!t);
  }

  /* 候选输出格式：通用 mp4 优先（让浏览器自行匹配音视频编码器），webm 兜底 */
  function supportedMimes(){
    /* 首选 H.264 Baseline（X/Twitter 明确支持、兼容性最好），通用 mp4 次之，webm 仅作本机预览兜底 */
    var list=[
      'video/mp4;codecs=avc1.42E01E',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    var out=[];
    if(window.MediaRecorder && MediaRecorder.isTypeSupported){
      for(var i=0;i<list.length;i++){
        try{ if(MediaRecorder.isTypeSupported(list[i])) out.push(list[i]); }catch(e){}
      }
    }
    return out;
  }

  runBtn.addEventListener('click',startProcess);

  function startProcess(){
    if(state.processing) return;
    result.classList.remove('on'); showError('');
    state.processing=true; updateRunBtn();
    progress.classList.add('on');
    barFill.style.width='0%'; pPercent.textContent='0%';

    /* 离线逐帧 seek 方案：不实时播放，每帧定位到源片真实帧边界再编码。
       步长取源片真实帧周期（先探测），不再一律按 60fps 补帧——给 30fps
       素材补 60fps，等于每两帧重复一次，播放器看着就是一顿一顿的。
       输出标准非 fragmented MP4（X 兼容），带音频。 */
    var srcW=video.videoWidth, srcH=video.videoHeight;
    var outSz=outputSize(srcW,srcH,cfg.maxEdge);
    var W=outSz.w, H=outSz.h;
    var canvas=document.createElement('canvas');
    canvas.width=W; canvas.height=H;
    var ctx=canvas.getContext('2d',{colorSpace:'srgb'});
    /* 只有真正放大时才开插值；1:1 绘制保持原始像素 */
    ctx.imageSmoothingEnabled=(W!==srcW||H!==srcH);
    ctx.imageSmoothingQuality='high';

    var frameCount=0, settled=false, skipFrames=0, encErrors=0;
    var FRAME_S=1/60, FRAME_US=Math.round(1e6/60);

    function cleanup(){
      video.onended=null; video.ontimeupdate=null;
      try{ video.pause(); }catch(e){}
    }
    function fail(msg){ if(settled) return; settled=true; cleanup(); failProcess(msg); }

    /* 等"目标帧真的解码出来"再返回；超时不再静默放行，交回调用方重试 */
    /* 已经在目标时刻且该帧可读：直接返回，省掉一次必然超时的 seek（首帧最常见） */
    function seekTo(t){
      return new Promise(function(res){
        if(Math.abs(video.currentTime-t)<0.001 && video.readyState>=2){ res(true); return; }
        var done=false, timer=null;
        function finish(ok){
          if(done) return; done=true;
          video.removeEventListener('seeked',onSeeked);
          if(timer) clearTimeout(timer);
          res(ok);
        }
        function onSeeked(){ finish(true); }
        video.addEventListener('seeked',onSeeked);
        video.currentTime=t;
        timer=setTimeout(function(){ finish(false); },1500);
      });
    }
    function waitRaf(){
      return new Promise(function(res){
        requestAnimationFrame(function(){
          requestAnimationFrame(res);
        });
      });
    }

    (async function(){
      /* 0. 探测源片真实帧率：后续步长与时间戳都以它为基准 */
      var fps=await probeFps();
      FRAME_S=1/fps; FRAME_US=Math.round(1e6/fps);

      /* 1. 音频重采样 */
      var audioBuffer=null;
      if(state.hasAudio){
        try{
          var fileBuf=await state.videoFile.arrayBuffer();
          var OffCtx=window.OfflineAudioContext||window.webkitOfflineAudioContext;
          var actx=new OffCtx(2, Math.max(1,Math.ceil(state.duration*48000)), 48000);
          var raw=await actx.decodeAudioData(fileBuf);
          var src=actx.createBufferSource();
          src.buffer=raw; src.connect(actx.destination); src.start();
          audioBuffer=await actx.startRendering();
        }catch(e){ audioBuffer=null; state.hasAudio=false; }
      }

      /* 2. muxer：视频 timescale 直接取帧率，一帧正好一个 tick，
         24/30fps 不会因为 timescale=60 变成 2/3 tick 交替（33ms、50ms 抖动） */
      var muxer=new Mp4Muxer.Muxer({
        target: new Mp4Muxer.ArrayBufferTarget(),
        video:{ codec:'avc', width:W, height:H, frameRate:fps },
        audio: audioBuffer ? { codec:'aac', numberOfChannels:2, sampleRate:48000 } : undefined,
        fastStart:'in-memory',
        firstTimestampBehavior:'offset'
      });

      /* 3. 视频编码器：VBR + quality，按画面复杂度分配码率；
         CBR 会把每帧压在固定预算上，静态镜头浪费、运动镜头又被摊薄 */
      var avcCodec=await pickAvcCodec(W,H,fps);
      var vBitrate=pickVideoBitrate(W,H,fps);
      var videoBytes=0;
      var videoEncoder=new VideoEncoder({
        output:function(chunk,meta){
          try{ videoBytes+=chunk.byteLength; muxer.addVideoChunk(chunk,meta); }catch(e){}
        },
        error:function(e){ fail('视频编码器错误：'+e.message); }
      });
      videoEncoder.configure({
        codec:avcCodec, width:W, height:H,
        bitrate:vBitrate, framerate:fps, latencyMode:'quality',
        bitrateMode:'variable',
        avc:{format:'avc'}
      });

      /* 4. 音频编码 */
      var audioEncoder=null;
      if(audioBuffer){
        audioEncoder=new AudioEncoder({
          output:function(chunk,meta){ try{ muxer.addAudioChunk(chunk,meta); }catch(e){} },
          error:function(e){ fail('音频编码器错误：'+e.message); }
        });
        audioEncoder.configure({
          codec:'mp4a.40.2', sampleRate:48000, numberOfChannels:2, bitrate:192000
        });
        var chs=audioBuffer.numberOfChannels || 2;
        var total=audioBuffer.length, block=1024;
        for(var off=0; off<total; off+=block){
          var n=Math.min(block,total-off);
          var data=new Float32Array(2*n);
          for(var c=0;c<2;c++){
            var srcCh = c<chs ? audioBuffer.getChannelData(c) : audioBuffer.getChannelData(0);
            data.set(srcCh.subarray(off,off+n), c*n);
          }
          var ts=Math.floor(off/48000*1e6);
          var ad=new AudioData({
            format:'f32-planar', sampleRate:48000, numberOfChannels:2,
            numberOfFrames:n, timestamp:ts, data:data
          });
          audioEncoder.encode(ad); ad.close();
        }
      }

      /* 5. 逐帧 seek 编码：步长=源帧周期，时间戳=帧序号×帧周期，帧间隔恒定 */
      video.muted=true;
      video.pause();
      /* 先等首帧的数据真的到位，否则 i=0 那次 seek 会白等到超时（还误记一次补帧） */
      await new Promise(function(res){
        if(video.readyState>=2) return res();
        video.addEventListener('loadeddata',res,{once:true});
        setTimeout(res,800);
      });
      var dur=isFinite(state.duration)?state.duration:0;
      if(dur<=0){ fail('视频时长异常'); return; }
      var totalFrames=Math.max(1,Math.round(dur*fps));
      var keyEvery=Math.max(1,Math.round(fps)); /* 每秒一个关键帧，便于拖动 */
      pLabel.textContent='处理中（按源片帧率逐帧精确编码）…';

      for(var i=0;i<totalFrames;i++){
        if(settled) return;
        var t=i*FRAME_S;
        if(t>dur) t=dur;
        var pct=Math.round(i/totalFrames*100);
        barFill.style.width=pct+'%'; pPercent.textContent=pct+'%';
        /* seek 到帧边界：seeked 触发时该帧已解码，可直接 drawImage。
           超时说明这帧没解出来，重试一次；仍失败就记账（画面会重复一帧） */
        var seekedOk=await seekTo(t);
        if(!seekedOk) seekedOk=await seekTo(t);
        if(!seekedOk) skipFrames++;
        ctx.drawImage(video,0,0,W,H);
        drawWatermark(ctx,W,H);
        /* 编码器队列深了才等：阈值放宽到 16，让硬件编码器并行消化，
           减少等待次数，整体更快；3 秒超时兜底 */
        if(videoEncoder.encodeQueueSize>16){
          await new Promise(function(res){
            var timer=setTimeout(function(){
              videoEncoder.ondequeue=null; clearTimeout(timer); res();
            },3000);
            videoEncoder.ondequeue=function(){
              if(videoEncoder.encodeQueueSize<=8){
                videoEncoder.ondequeue=null; clearTimeout(timer); res();
              }
            };
          });
        }
        try{
          var vf=new VideoFrame(canvas,{timestamp:Math.round(i*1e6/fps),duration:FRAME_US});
          videoEncoder.encode(vf,{keyFrame:frameCount%keyEvery===0});
          vf.close(); frameCount++;
        }catch(e){ encErrors++; }
      }

      /* 6. 收尾 */
      barFill.style.width='100%'; pPercent.textContent='100%';
      await videoEncoder.flush();
      if(audioEncoder) await audioEncoder.flush();
      muxer.finalize();
      var buffer=muxer.target.buffer;
      if(!buffer||buffer.byteLength<100){ fail('编码结果为空'); return; }
      var blob=new Blob([buffer],{type:'video/mp4'});
      settled=true; cleanup();
      finishProcess(blob,'video/mp4',{
        codec:avcCodec, cfgBitrate:vBitrate, frames:frameCount,
        videoBytes:videoBytes, duration:dur,
        width:W, height:H, fps:fps, skip:skipFrames, encErrors:encErrors
      });
    })().catch(function(e){
      fail(e&&e.message?e.message:e);
    });
  }

  function canUseWebCodecs(){
    /* 只检查真正用到的能力：VideoEncoder / AudioEncoder / 内联 mp4-muxer；
       不再依赖 MediaStreamTrackProcessor（旧 captureStream 链路已废弃） */
    return !!(window.VideoEncoder && window.AudioEncoder &&
              window.Mp4Muxer && window.Mp4Muxer.Muxer && window.Mp4Muxer.ArrayBufferTarget);
  }

  /* H.264 编码时 codedWidth/Height 会按 16 对齐（宏块），
     实际 coded area 比原始像素大，必须用对齐后的尺寸判断 level，
     否则会触发 "coded area exceeds maximum" 硬错误。 */
  function codedSize(v){
    return Math.ceil(v/16)*16;
  }
  function pickAvcLevel(width,height){
    var codedW=codedSize(width), codedH=codedSize(height);
    var codedPixels=codedW*codedH;
    if(codedPixels<=414720) return 0x1E;
    if(codedPixels<=921600) return 0x1F;
    if(codedPixels<=2073600) return 0x28;
    if(codedPixels<=2228224) return 0x2A;
    if(codedPixels<=8847360) return 0x33;
    return 0x34;
  }
  /* 逐级探测浏览器支持的最高 H.264 profile：High > Main > Baseline，
     level 按 16 对齐后的 coded area 动态匹配，避免 level 撑不住的硬错误 */
  async function pickAvcCodec(width,height,fps){
    var rate=fps||60;
    var levelHex=pickAvcLevel(width,height).toString(16).padStart(2,'0');
    var profiles=[0x64,0x4d,0x42]; /* High / Main / Baseline */
    for(var i=0;i<profiles.length;i++){
      var profileHex=profiles[i].toString(16).padStart(2,'0');
      var codec='avc1.'+profileHex+'00'+levelHex;
      try{
        var r=await VideoEncoder.isConfigSupported({
          codec:codec, width:width, height:height,
          bitrate:pickVideoBitrate(width,height,rate), framerate:rate,
          avc:{format:'avc'}
        });
        if(r.supported) return codec;
      }catch(e){}
    }
    /* 兜底：Baseline + 按当前分辨率动态计算的 level */
    return 'avc1.4200'+levelHex;
  }

  /* 按"像素数 × 帧率 × 每像素 0.22bit"算目标码率，VBR 下作为上限：
     1080p30 ≈ 13.7Mbps，4K30 ≈ 55Mbps；下限 8M 避免低分辨率被压糊 */
  function pickVideoBitrate(width,height,fps){
    var rate=fps||60;
    var br=Math.round(width*height*rate*0.22);
    return Math.max(8_000_000, Math.min(120_000_000, br));
  }

  /* 探测源片真实帧率：短播 0.3 秒，用 requestVideoFrameCallback 记媒体时间，
     取最接近的标准帧率（24/25/30/60…）；探测失败退回 60fps，不影响主流程 */
  function probeFps(){
    return new Promise(function(res){
      var fallback=60;
      if(!video.requestVideoFrameCallback ||
         !isFinite(state.duration) || state.duration<=0){
        res(fallback); return;
      }
      var samples=[], finished=false, id=null;
      var prevMuted=video.muted, prevRate=video.playbackRate;

      function stop(){
        if(finished) return; finished=true;
        if(id!==null){ try{ video.cancelVideoFrameCallback(id); }catch(e){} }
        try{ video.pause(); }catch(e){}
        video.muted=prevMuted; video.playbackRate=prevRate;
        try{ video.currentTime=0; }catch(e){}
        var f=fallback;
        if(samples.length>=4){
          var span=samples[samples.length-1]-samples[0];
          var n=samples.length-1;
          if(span>0.05){
            var measured=n/span;
            var cands=[15,24,25,30,48,50,60,90,120];
            for(var i=0;i<cands.length;i++){
              if(Math.abs(cands[i]-measured)<=cands[i]*0.05){ f=cands[i]; break; }
            }
          }
        }
        res(f);
      }
      function onFrame(now,meta){
        if(finished) return;
        samples.push(meta.mediaTime);
        var elapsed=(samples.length>1)?(samples[samples.length-1]-samples[0]):0;
        if(samples.length>=4 && elapsed>=0.3){ stop(); return; }
        if(samples.length>=40){ stop(); return; }
        id=video.requestVideoFrameCallback(onFrame);
      }
      video.muted=true; video.playbackRate=1;
      try{ video.currentTime=0; }catch(e){}
      id=video.requestVideoFrameCallback(onFrame);
      var p=video.play();
      if(p && p.catch) p.catch(function(){ stop(); });
      setTimeout(function(){ if(!finished) stop(); },2500);
    });
  }

  /* 逐个尝试候选格式：某格式录不到数据或报错时自动切下一个，绝不再产出空文件 */
  function runMediaRecorderChain(mimes,idx){
    if(idx>=mimes.length){
      return Promise.reject('所有输出格式均录制失败，请更换最新版 Chrome 或 Edge 后重试。');
    }
    if(idx>0){
      pLabel.textContent='当前格式不兼容，正在切换备用格式（第 '+ (idx+1) +' 种）…';
    }else{
      pLabel.textContent = '处理中（按原速逐帧绘制，保证原画质与帧率）…';
    }
    return attemptEncode(mimes[idx]).catch(function(){
      return runMediaRecorderChain(mimes,idx+1);
    });
  }

  /* ===== WebCodecs 直连：逐帧 seek 编码 H.264 + AAC MP4 =====
     架构：离线逐帧 seek，不实时播放。每一帧：
       1) video.currentTime = t
       2) 等 seeked 事件（视频解码出该时刻帧）
       3) drawImage 到 canvas（1:1）
       4) new VideoFrame + encode
     这样时间戳与画面严格对应，不受 rAF 节流、编码器速度、系统负载影响，
     从根上消除"几帧卡住不动"和"时间戳/画面对位漂移"。 */
  function tryWebCodecsEncode(){
    return new Promise(function(resolve,reject){
      var W=video.videoWidth, H=video.videoHeight;
      var settled=false, frameCount=0;
      var workCanvas=document.createElement('canvas');
      workCanvas.width=W; workCanvas.height=H;
      var wctx=workCanvas.getContext('2d',{colorSpace:'srgb'});
      wctx.imageSmoothingEnabled=false;
      var muxer=null, videoEncoder=null, audioEncoder=null;

      function cleanup(){
        video.onended=null; video.ontimeupdate=null;
        try{ video.pause(); }catch(e){}
      }
      function fail(msg){ if(settled) return; settled=true; cleanup(); reject(msg); }

      var FRAME_US=Math.round(1e6/60);
      var FRAME_S=1/60;

      function seekTo(t){
        return new Promise(function(res){
          var done=false;
          function onSeeked(){
            if(done) return; done=true;
            video.removeEventListener('seeked',onSeeked);
            resolve();
          }
          video.addEventListener('seeked',onSeeked);
          video.currentTime=t;
          /* 兜底：某些小视频 seek 立即完成但不触发 seeked */
          setTimeout(function(){
            if(!done){ done=true; video.removeEventListener('seeked',onSeeked); resolve(); }
          },500);
        });
      }
      function waitForQueue(){
        if(videoEncoder.encodeQueueSize<=6) return Promise.resolve();
        return new Promise(function(res){
          var timer=setTimeout(function(){
            videoEncoder.ondequeue=null; clearTimeout(timer); res();
          },3000);
          videoEncoder.ondequeue=function(){
            if(videoEncoder.encodeQueueSize<=6){
              videoEncoder.ondequeue=null; clearTimeout(timer); res();
            }
          };
        });
      }

      (async function(){
        /* 1. 音频重采样到 48kHz */
        var audioBuffer=null;
        if(state.hasAudio){
          try{
            var fileBuf=await state.videoFile.arrayBuffer();
            var OffCtx=window.OfflineAudioContext||window.webkitOfflineAudioContext;
            var actx=new OffCtx(2, Math.max(1,Math.ceil(state.duration*48000)), 48000);
            var raw=await actx.decodeAudioData(fileBuf);
            var src=actx.createBufferSource();
            src.buffer=raw; src.connect(actx.destination); src.start();
            audioBuffer=await actx.startRendering();
          }catch(e){ audioBuffer=null; state.hasAudio=false; }
        }

        /* 2. muxer */
        muxer=new Mp4Muxer.Muxer({
          target: new Mp4Muxer.ArrayBufferTarget(),
          video:{ codec:'avc', width:W, height:H, frameRate:60 },
          audio: audioBuffer ? { codec:'aac', numberOfChannels:2, sampleRate:48000 } : undefined,
          fastStart:'in-memory',
          firstTimestampBehavior:'offset'
        });

        /* 3. 视频编码器 */
        var avcCodec=await pickAvcCodec(W,H);
        var vBitrate=pickVideoBitrate(W,H);
        var videoBytes=0;
        videoEncoder=new VideoEncoder({
          output:function(chunk,meta){
            try{ videoBytes+=chunk.byteLength; muxer.addVideoChunk(chunk,meta); }catch(e){}
          },
          error:function(e){ fail('视频编码器错误：'+e.message); }
        });
        videoEncoder.configure({
          codec:avcCodec, width:W, height:H,
          bitrate:vBitrate, framerate:60, latencyMode:'quality',
          bitrateMode:'variable',
          avc:{format:'avc'}
        });

        /* 4. 音频编码 */
        if(audioBuffer){
          audioEncoder=new AudioEncoder({
            output:function(chunk,meta){ try{ muxer.addAudioChunk(chunk,meta); }catch(e){} },
            error:function(e){ fail('音频编码器错误：'+e.message); }
          });
          audioEncoder.configure({
            codec:'mp4a.40.2', sampleRate:48000, numberOfChannels:2, bitrate:192000
          });
          var chs=audioBuffer.numberOfChannels || 2;
          var total=audioBuffer.length, block=1024;
          for(var off=0; off<total; off+=block){
            var n=Math.min(block,total-off);
            var data=new Float32Array(2*n);
            for(var c=0;c<2;c++){
              var srcCh = c<chs ? audioBuffer.getChannelData(c) : audioBuffer.getChannelData(0);
              data.set(srcCh.subarray(off,off+n), c*n);
            }
            var ts=Math.floor(off/48000*1e6);
            var ad=new AudioData({
              format:'f32-planar', sampleRate:48000, numberOfChannels:2,
              numberOfFrames:n, timestamp:ts, data:data
            });
            audioEncoder.encode(ad); ad.close();
          }
        }

        /* 5. 逐帧 seek 编码 */
        video.muted=true;
        video.pause();
        var dur = isFinite(state.duration) ? state.duration : 0;
        if(dur<=0){ fail('视频时长异常，无法处理'); return; }
        var totalFrames = Math.ceil(dur/FRAME_S);
        pLabel.textContent='处理中（逐帧精确编码，保证每帧对位）…';

        for(var i=0; i<totalFrames; i++){
          if(settled) return;
          var t = i*FRAME_S;
          if(t > dur) t = dur;
          /* 进度条 */
          var pct = Math.round(i/totalFrames*100);
          barFill.style.width=pct+'%'; pPercent.textContent=pct+'%';
          /* seek 到该时刻，等解码完成 */
          await seekTo(t);
          /* 等一帧让浏览器真正把该帧画到 video 元素 */
          await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
          wctx.drawImage(video,0,0,W,H);
          drawWatermark(wctx,W,H);
          await waitForQueue();
          if(settled) return;
          try{
            var vf=new VideoFrame(workCanvas,{
              timestamp:Math.round(t*1e6), duration:FRAME_US
            });
            videoEncoder.encode(vf,{keyFrame:frameCount%60===0});
            vf.close(); frameCount++;
          }catch(e){}
        }

        /* 6. 收尾 */
        barFill.style.width='100%'; pPercent.textContent='100%';
        await videoEncoder.flush();
        if(audioEncoder) await audioEncoder.flush();
        muxer.finalize();
        var buffer=muxer.target.buffer;
        if(!buffer || buffer.byteLength<100){ fail('编码结果为空'); return; }
        var blob=new Blob([buffer],{type:'video/mp4'});
        settled=true; cleanup();
        resolve({blob:blob, mime:'video/mp4', diag:{
          codec:avcCodec, cfgBitrate:vBitrate, frames:frameCount,
          videoBytes:videoBytes, duration:dur
        }});
      })().catch(function(e){
        fail(e && e.message ? e.message : e);
      });
    });
  }

  function seekToStart(){
    return new Promise(function(resolve,reject){
      var done=false;
      function onSeeked(){ done=true; video.removeEventListener('seeked',onSeeked); resolve(); }
      video.addEventListener('seeked',onSeeked);
      video.currentTime=0;
      setTimeout(function(){ if(!done){ video.removeEventListener('seeked',onSeeked); reject('视频跳转超时'); } },8000);
    });
  }

  function attemptEncode(mime){
    return new Promise(function(resolve,reject){
      var W=video.videoWidth, H=video.videoHeight;
      var canvas=document.createElement('canvas');
      canvas.width=W; canvas.height=H;
      var ctx=canvas.getContext('2d');
      var rate=state.hasAudio?1:4;
      var rafId=0, settled=false, endFired=false, chunks=[];
      var canvasStream=canvas.captureStream(30);

      /* 音频轨：muted 只影响扬声器，不影响 captureStream 输出 */
      if(state.hasAudio){
        try{
          var src=video.captureStream ? video.captureStream() :
                  (video.mozCaptureStream && video.mozCaptureStream());
          src.getAudioTracks().forEach(function(t){ canvasStream.addTrack(t); });
        }catch(e){}
      }

      var rec;
      try{
        rec=new MediaRecorder(canvasStream,{mimeType:mime,videoBitsPerSecond:pickVideoBitrate(W,H)});
      }catch(e){
        cleanup(); reject('录制初始化失败：'+e.message); return;
      }

      function cleanup(){
        if(rafId) cancelAnimationFrame(rafId);
        video.onended=null; video.ontimeupdate=null;
        try{ video.pause(); }catch(e){}
        try{ canvasStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      }
      function fail(msg){
        if(settled) return; settled=true; cleanup(); reject(msg);
      }
      function drawLoop(){
        if(settled || video.ended) return;
        ctx.drawImage(video,0,0,W,H);
        drawWatermark(ctx,W,H);
        rafId=requestAnimationFrame(drawLoop);
      }
      function finishOnce(){
        if(endFired||settled) return; endFired=true;
        setTimeout(function(){
          try{ if(rec.state!=='inactive') rec.stop(); }catch(e){ fail('录制结束失败：'+e.message); }
        },400);
      }

      rec.ondataavailable=function(e){ if(e.data && e.data.size>0) chunks.push(e.data); };
      rec.onerror=function(e){
        fail('录制器错误：'+((e.error && e.error.name)||e.name||'未知错误'));
      };
      rec.onstop=function(){
        if(settled) return;
        var total=0;
        for(var i=0;i<chunks.length;i++) total+=chunks[i].size;
        if(total===0){ cleanup(); reject('empty'); return; } /* 空数据：交给上层换格式重试 */
        settled=true;
        var blob=new Blob(chunks,{type:mime.split(';')[0]});
        cleanup();
        resolve({blob:blob,mime:mime});
      };

      video.muted=true;
      video.playbackRate=rate;
      video.onended=finishOnce;
      video.ontimeupdate=function(){
        if(!isFinite(state.duration)||state.duration<=0) return;
        var pct=Math.min(100,Math.round(video.currentTime/state.duration*100));
        barFill.style.width=pct+'%'; pPercent.textContent=pct+'%';
        if(video.currentTime>=state.duration-0.08) finishOnce(); /* ended 未触发时的保险 */
      };

      seekToStart().then(function(){
        ctx.drawImage(video,0,0,W,H);
        drawWatermark(ctx,W,H);
        rafId=requestAnimationFrame(drawLoop);
        try{ rec.start(); }catch(e){ fail('录制启动失败：'+e.message); return; }
        /* 启动后状态自检：未进入 recording 立即判失败，走降级 */
        setTimeout(function(){
          if(!settled && rec.state!=='recording') fail('录制未正常开始');
        },600);
        return video.play();
      }).catch(function(err){
        fail('播放失败：'+(err && err.message ? err.message : err));
      });
    });
  }

  function drawWatermark(ctx,W,H){
    var w=W*cfg.ratio/100;
    var h=w*imgAspectRatio();
    var m=cfg.margin;
    var col=cfg.position.charAt(1), row=cfg.position.charAt(0);
    var x,y;
    if(col==='l') x=m;
    else if(col==='c') x=(W-w)/2;
    else x=W-w-m;
    if(row==='t') y=m;
    else if(row==='m') y=(H-h)/2;
    else y=H-h-m;
    ctx.globalAlpha=cfg.opacity/100;
    ctx.drawImage(wmPreviewImg,x,y,w,h);
    ctx.globalAlpha=1;
  }

  function failProcess(msg){
    state.processing=false;
    try{ video.pause(); }catch(e){}
    video.onended=null; video.ontimeupdate=null;
    progress.classList.remove('on');
    showError(msg); updateRunBtn();
  }

  function finishProcess(blob,mime,diag){
    state.processing=false;
    try{ video.pause(); }catch(e){}
    video.onended=null; video.ontimeupdate=null;
    progress.classList.remove('on');
    if(!blob || blob.size===0){
      showError('生成失败：未采集到视频数据，已阻止下载空文件。请重试或更换浏览器。');
      return;
    }
    var ext = mime.indexOf('mp4')>=0 ? 'mp4' : 'webm';
    var base = state.videoFile.name.replace(/\.[^.]+$/,'');
    var outName=base+'_watermark.'+ext;
    var url=URL.createObjectURL(blob);
    var formatNote = ext==='webm' ? '（当前浏览器不支持 MP4 录制，输出为 WebM，无法直接上传 X，请改用系统 Edge/Chrome 打开本页面重新生成）' : '';
    var sw=Math.round(video.videoWidth), sh=Math.round(video.videoHeight);
    var dw=(diag&&diag.width)?diag.width:sw, dh=(diag&&diag.height)?diag.height:sh;
    var fitTxt=(dw===sw&&dh===sh)?'（与源片一致）':'（源片 '+sw+'×'+sh+'，已等比放大）';
    var fpsTxt=(diag&&diag.fps)?(' · '+diag.fps+'fps'):'';
    var outInfo = '输出分辨率：'+dw+'×'+dh+fitTxt+fpsTxt+' · 大小：'+formatSize(blob.size);
    /* 诊断行：实际 codec / 实际视频码率，便于判断是否真的走了 WebCodecs 高码率链路 */
    if(diag && diag.codec){
      var mbps = diag.duration>0 ? (diag.videoBytes*8/diag.duration/1e6) : 0;
      outInfo += ' · 编码器：'+diag.codec+' · 帧数：'+diag.frames+
        ' · 实际视频码率：'+mbps.toFixed(1)+'Mbps（目标 '+(diag.cfgBitrate/1e6).toFixed(0)+'M）';
    }
    if(diag && diag.skip) outInfo += ' · 解码超时补帧：'+diag.skip;
    if(diag && diag.encErrors) outInfo += ' · 编码失败帧：'+diag.encErrors;
    resultMeta.textContent=outInfo+formatNote+' · 文件名：'+outName;
    result.classList.add('on');
    downloadBtn.onclick=function(){
      var a=document.createElement('a');
      a.href=url; a.download=outName;
      document.body.appendChild(a); a.click(); a.remove();
    };
  }

  againBtn.addEventListener('click',function(){
    result.classList.remove('on');
    barFill.style.width='0%'; pPercent.textContent='0%';
  });

  function formatSize(n){
    if(n>1048576) return (n/1048576).toFixed(1)+' MB';
    if(n>1024) return (n/1024).toFixed(0)+' KB';
    return n+' B';
  }

  /* ---------- 初始化 ---------- */
  syncGrid(); syncRangeLabels(); updateRunBtn();
})();
</script>
</body>
</html>
